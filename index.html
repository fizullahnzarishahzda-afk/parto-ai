<!doctype html>
<html lang="fa" dir="rtl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>پرتو هوش مصنوعی فیض الله نظری</title>
  <style>
    * { box-sizing: border-box; font-family: Tahoma, Arial, sans-serif; }
    body { margin: 0; background: #0f172a; color: #f8fafc; display: flex; flex-direction: column; height: 100vh; }

    header {
      padding: 12px 16px;
      background: #1e293b;
      border-bottom: 1px solid #334155;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
    }
    .brand { display: flex; align-items: center; gap: 8px; font-weight: bold; font-size: 1rem; }
    .dot { width: 9px; height: 9px; border-radius: 50%; background: #22c55e; display: inline-block; flex-shrink: 0; }
    .btn-clear {
      padding: 6px 12px;
      border-radius: 8px;
      border: 1px solid #475569;
      background: #0f172a;
      color: #e2e8f0;
      cursor: pointer;
      font-size: 0.84rem;
    }
    .btn-clear:hover { background: #334155; }

    .active-tool-bar {
      padding: 6px 16px;
      background: #131c31;
      border-bottom: 1px solid #1e293b;
      font-size: 0.8rem;
      color: #93c5fd;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
    }
    .reset-tool-btn {
      background: transparent;
      border: none;
      color: #cbd5e1;
      text-decoration: underline;
      cursor: pointer;
      font-size: 0.78rem;
      padding: 0;
    }

    #chat { flex: 1; overflow-y: auto; padding: 16px; display: flex; flex-direction: column; gap: 12px; position: relative; }

    .welcome-box {
      margin: auto;
      max-width: 560px;
      width: 100%;
      background: #1e293b;
      border: 1px solid #334155;
      border-radius: 16px;
      padding: 20px 16px;
      text-align: center;
    }
    .welcome-title { font-size: 1.05rem; font-weight: bold; color: #38bdf8; margin-bottom: 10px; }
    .welcome-text { font-size: 0.95rem; line-height: 1.85; color: #f1f5f9; margin-bottom: 16px; }

    .quick-actions {
      display: flex;
      flex-direction: column;
      gap: 8px;
      align-items: center;
    }
    .quick-item {
      width: 100%;
      max-width: 340px;
      padding: 10px 14px;
      border-radius: 12px;
      border: 1px solid #334155;
      background: #0f172a;
      color: #f8fafc;
      font-size: 0.88rem;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
    }
    .quick-item:hover { background: #1e293b; border-color: #60a5fa; }

    .msg-wrap { display: flex; flex-direction: column; max-width: 85%; gap: 4px; }
    .wrap-user { align-self: flex-start; }
    .wrap-bot { align-self: flex-end; }

    .msg { padding: 12px 14px; border-radius: 12px; line-height: 1.75; word-wrap: break-word; }
    .user { background: #2563eb; color: #fff; white-space: pre-wrap; }
    .bot { background: #1e293b; border: 1px solid #334155; }
    .bot p { margin: 0 0 8px 0; }
    .bot p:last-child { margin-bottom: 0; }
    .bot h3 { margin: 10px 0 6px 0; color: #38bdf8; font-size: 1rem; }
    .bot ul { margin: 4px 0 8px 0; padding-right: 20px; }
    .bot li { margin-bottom: 4px; }

    .copy-btn {
      align-self: flex-end;
      padding: 3px 9px;
      font-size: 0.75rem;
      border-radius: 6px;
      border: 1px solid #334155;
      background: #0f172a;
      color: #94a3b8;
      cursor: pointer;
    }
    .copy-btn:hover { color: #f8fafc; border-color: #64748b; }

    .plus-menu {
      position: fixed;
      bottom: 74px;
      right: 16px;
      width: 230px;
      background: #1e293b;
      border: 1px solid #475569;
      border-radius: 14px;
      padding: 6px;
      display: none;
      flex-direction: column;
      gap: 2px;
      box-shadow: 0 10px 25px rgba(0, 0, 0, 0.45);
      z-index: 20;
    }
    .plus-menu.open { display: flex; }
    .menu-opt {
      padding: 10px 12px;
      border-radius: 10px;
      border: none;
      background: transparent;
      color: #f8fafc;
      text-align: right;
      font-size: 0.88rem;
      cursor: pointer;
      display: flex;
      align-items: center;
      gap: 10px;
    }
    .menu-opt:hover, .menu-opt.active { background: #2563eb; color: #fff; }

    form {
      display: flex;
      gap: 8px;
      padding: 12px;
      background: #1e293b;
      border-top: 1px solid #334155;
      align-items: center;
    }
    .plus-btn {
      width: 42px;
      height: 42px;
      border-radius: 50%;
      border: 1px solid #475569;
      background: #0f172a;
      color: #f8fafc;
      font-size: 1.35rem;
      line-height: 1;
      cursor: pointer;
      flex-shrink: 0;
    }
    .plus-btn:hover { background: #334155; }

    textarea {
      flex: 1;
      resize: none;
      height: 46px;
      padding: 10px;
      border-radius: 10px;
      border: 1px solid #475569;
      background: #0f172a;
      color: #fff;
    }
    button[type="submit"] {
      height: 46px;
      padding: 0 16px;
      border: none;
      border-radius: 10px;
      background: #22c55e;
      color: #052e16;
      font-weight: bold;
      cursor: pointer;
      flex-shrink: 0;
    }
    button:disabled { opacity: 0.6; cursor: not-allowed; }
  </style>
</head>
<body>
  <header>
    <div class="brand">
      <span class="dot"></span>
      <span>پرتو هوش مصنوعی فیض الله نظری</span>
    </div>
    <button type="button" class="btn-clear" id="clearBtn">پاک کردن چت</button>
  </header>

  <div class="active-tool-bar">
    <span id="activeToolLabel">حالت فعلی: گفتگوی عادی</span>
    <button type="button" class="reset-tool-btn" id="resetToolBtn">بازگشت به حالت عادی</button>
  </div>

  <div id="chat"></div>

  <div class="plus-menu" id="plusMenu">
    <button type="button" class="menu-opt" data-tool="camera">📷 دوربین</button>
    <button type="button" class="menu-opt" data-tool="photos">🖼️ تصاویر</button>
    <button type="button" class="menu-opt" data-tool="files">📎 فایل‌ها</button>
    <button type="button" class="menu-opt" data-tool="plugins">🔌 افزونه‌ها</button>
    <button type="button" class="menu-opt" data-tool="think">🧠 تفکر عمیق‌تر</button>
  </div>

  <form id="form">
    <button type="button" class="plus-btn" id="plusBtn" title="گزینه‌های بیشتر">+</button>
    <textarea id="input" placeholder="از پرتو هر سوالی داری بپرس..."></textarea>
    <button type="submit" id="sendBtn">ارسال</button>
  </form>

  <input type="file" id="filePicker" style="display:none" />

  <script>
    const WELCOME_TITLE = "پرتو هوش مصنوعی فیض الله نظری";
    const WELCOME_MESSAGE = "من (پرتو) هستم دستیار هوش مصنوعی فیض الله نظری چطور میتوانم کمکتان کنم ؟";

    const chat = document.getElementById("chat");
    const form = document.getElementById("form");
    const input = document.getElementById("input");
    const sendBtn = document.getElementById("sendBtn");
    const clearBtn = document.getElementById("clearBtn");
    const plusBtn = document.getElementById("plusBtn");
    const plusMenu = document.getElementById("plusMenu");
    const activeToolLabel = document.getElementById("activeToolLabel");
    const resetToolBtn = document.getElementById("resetToolBtn");
    const filePicker = document.getElementById("filePicker");
    const menuOpts = document.querySelectorAll(".menu-opt");

    let currentTool = "normal";
    let history = [];

    const toolLabels = {
      normal: "حالت فعلی: گفتگوی عادی",
      image_prompt: "حالت فعلی: ایجاد تصویر یا استیکر (پرامپت/توضیح)",
      write_edit: "حالت فعلی: بنویسید یا ویرایش کنید",
      web_guide: "حالت فعلی: جستجو در وب (راهنمایی و تحقیق)",
      camera: "حالت فعلی: دوربین (توضیح متنی صحنه یا سوژه)",
      photos: "حالت فعلی: تصاویر (توصیف و پرامپت تصویر)",
      files: "حالت فعلی: فایل‌ها (متن فایل را پیست کنید)",
      plugins: "حالت فعلی: افزونه‌ها",
      think: "حالت فعلی: تفکر عمیق‌تر"
    };

    const toolInstructions = {
      normal: "پاسخ‌ها را واضح، صمیمی و دقیق بده.",
      image_prompt: "برای درخواست تصویر یا استیکر، یک توضیح/پرامپت دقیق و قابل استفاده بده و اگر نیاز به ابزار تولید تصویر مستقل باشد شفاف توضیح بده.",
      write_edit: "متن را با کیفیت بالا بنویس، اصلاح کن یا بازنویسی کن.",
      web_guide: "موضوع را با توضیح شفاف و ساختاریافته بررسی کن؛ اگر نیاز به اطلاعات زنده اینترنتی باشد که در دسترس نیست، صادقانه بگو.",
      camera: "بر اساس توضیح کاربر درباره صحنه یا سوژه دوربین، راهنمای دقیق و کاربردی بده.",
      photos: "بر اساس توضیح کاربر درباره عکس، ایده، تحلیل یا پرامپت مناسب بده.",
      files: "محتوای متنی‌ای که کاربر درباره فایل می‌فرستد را دقیق بررسی، خلاصه یا ویرایش کن.",
      plugins: "راهکار عملی و مرحله‌به‌مرحله برای قابلیت یا ابزار مورد نظر ارائه بده.",
      think: "مسئله را عمیق‌تر، مرحله‌به‌مرحله و با دقت بالا تحلیل کن و پاسخ جامع بده."
    };

    function setTool(toolKey) {
      currentTool = toolKey;
      activeToolLabel.textContent = toolLabels[toolKey] || toolLabels.normal;
      menuOpts.forEach((opt) => {
        opt.classList.toggle("active", opt.dataset.tool === toolKey);
      });
    }

    plusBtn.addEventListener("click", (e) => {
      e.stopPropagation();
      plusMenu.classList.toggle("open");
    });

    document.addEventListener("click", (e) => {
      if (!plusMenu.contains(e.target) && e.target !== plusBtn) {
        plusMenu.classList.remove("open");
      }
    });

    resetToolBtn.addEventListener("click", () => {
      setTool("normal");
    });

    menuOpts.forEach((opt) => {
      opt.addEventListener("click", () => {
        const chosen = opt.dataset.tool;
        plusMenu.classList.remove("open");

        if (chosen === "camera") {
          filePicker.accept = "image/*";
          filePicker.setAttribute("capture", "environment");
          setTool("camera");
          filePicker.click();
          return;
        }
        if (chosen === "photos") {
          filePicker.accept = "image/*";
          filePicker.removeAttribute("capture");
          setTool("photos");
          filePicker.click();
          return;
        }
        if (chosen === "files") {
          filePicker.accept = ".txt,.md,.csv,.json,.html,.py,.js";
          filePicker.removeAttribute("capture");
          setTool("files");
          filePicker.click();
          return;
        }

        setTool(chosen);
        input.focus();
      });
    });

    filePicker.addEventListener("change", () => {
      const f = filePicker.files && filePicker.files[0];
      if (!f) return;
      if (f.type && f.type.startsWith("text/")) {
        const reader = new FileReader();
        reader.onload = () => {
          const content = String(reader.result || "").slice(0, 4000);
          input.value = `محتوای فایل (${f.name}):\n${content}`;
          input.focus();
        };
        reader.readAsText(f, "utf-8");
      } else {
        input.value = `فایل «${f.name}» انتخاب شد. درباره این موضوع چه کمکی می‌خواهی؟`;
        input.focus();
      }
      filePicker.value = "";
    });

    function renderWelcome() {
      if (chat.children.length > 0) return;
      const box = document.createElement("div");
      box.className = "welcome-box";
      box.id = "welcomeBox";

      const titleEl = document.createElement("div");
      titleEl.className = "welcome-title";
      titleEl.textContent = WELCOME_TITLE;

      const textEl = document.createElement("div");
      textEl.className = "welcome-text";
      textEl.textContent = WELCOME_MESSAGE;

      const quickList = document.createElement("div");
      quickList.className = "quick-actions";

      const items = [
        { label: "🖼️ ایجاد تصویر یا استیکر", tool: "image_prompt", sample: "یک پرامپت دقیق برای ساخت تصویر یا استیکر بنویس: " },
        { label: "✏️ بنویسید یا ویرایش کنید", tool: "write_edit", sample: "این متن را بنویس یا ویرایش کن: " },
        { label: "🌐 جستجو در وب", tool: "web_guide", sample: "درباره این موضوع توضیح کامل و دقیق بده: " }
      ];

      items.forEach((it) => {
        const btn = document.createElement("button");
        btn.type = "button";
        btn.className = "quick-item";
        btn.textContent = it.label;
        btn.addEventListener("click", () => {
          setTool(it.tool);
          input.value = it.sample;
          input.focus();
        });
        quickList.appendChild(btn);
      });

      box.appendChild(titleEl);
      box.appendChild(textEl);
      box.appendChild(quickList);
      chat.appendChild(box);
    }

    function removeWelcome() {
      const box = document.getElementById("welcomeBox");
      if (box) box.remove();
    }

    function escapeHtml(str) {
      return str
        .replace(/&/g, "&amp;")
        .replace(/</g, "&lt;")
        .replace(/>/g, "&gt;")
        .replace(/"/g, "&quot;");
    }

    function formatBotText(raw) {
      const safe = escapeHtml(raw || "");
      const lines = safe.split("\n");
      let html = "";
      let inList = false;

      for (let line of lines) {
        let trimmed = line.trim();
        if (!trimmed) {
          if (inList) {
            html += "</ul>";
            inList = false;
          }
          continue;
        }

        trimmed = trimmed.replace(/\*\*(.+?)\*\*/g, "<strong>$1</strong>");

        if (/^#{1,6}\s+/.test(trimmed)) {
          if (inList) {
            html += "</ul>";
            inList = false;
          }
          const headingText = trimmed.replace(/^#{1,6}\s+/, "");
          html += `<h3>${headingText}</h3>`;
        } else if (/^[-*•]\s+/.test(trimmed)) {
          if (!inList) {
            html += "<ul>";
            inList = true;
          }
          const itemText = trimmed.replace(/^[-*•]\s+/, "");
          html += `<li>${itemText}</li>`;
        } else {
          if (inList) {
            html += "</ul>";
            inList = false;
          }
          html += `<p>${trimmed}</p>`;
        }
      }

      if (inList) {
        html += "</ul>";
      }

      return html || "<p>پاسخی دریافت نشد.</p>";
    }

    function addUserMessage(text) {
      removeWelcome();
      const wrap = document.createElement("div");
      wrap.className = "msg-wrap wrap-user";
      const div = document.createElement("div");
      div.className = "msg user";
      div.textContent = text;
      wrap.appendChild(div);
      chat.appendChild(wrap);
      chat.scrollTop = chat.scrollHeight;
    }

    function createBotMessage(initialText = "پرتو در حال پاسخ دادن است...") {
      const wrap = document.createElement("div");
      wrap.className = "msg-wrap wrap-bot";
      const div = document.createElement("div");
      div.className = "msg bot";
      div.textContent = initialText;

      const copyBtn = document.createElement("button");
      copyBtn.type = "button";
      copyBtn.className = "copy-btn";
      copyBtn.textContent = "کپی";
      copyBtn.style.display = "none";

      wrap.appendChild(div);
      wrap.appendChild(copyBtn);
      chat.appendChild(wrap);
      chat.scrollTop = chat.scrollHeight;

      return {
        setReply(rawText) {
          div.innerHTML = formatBotText(rawText);
          copyBtn.style.display = "inline-block";
          copyBtn.onclick = async () => {
            try {
              await navigator.clipboard.writeText(rawText);
              copyBtn.textContent = "کپی شد ✓";
              setTimeout(() => (copyBtn.textContent = "کپی"), 1500);
            } catch {
              copyBtn.textContent = "ناموفق";
              setTimeout(() => (copyBtn.textContent = "کپی"), 1500);
            }
          };
          chat.scrollTop = chat.scrollHeight;
        },
        setError(errText) {
          div.textContent = errText;
          chat.scrollTop = chat.scrollHeight;
        }
      };
    }

    clearBtn.addEventListener("click", () => {
      chat.innerHTML = "";
      history = [];
      renderWelcome();
    });

    input.addEventListener("keydown", (e) => {
      if (e.key === "Enter" && !e.shiftKey) {
        e.preventDefault();
        form.requestSubmit();
      }
    });

    form.addEventListener("submit", async (e) => {
      e.preventDefault();
      const text = input.value.trim();
      if (!text) return;

      input.value = "";
      sendBtn.disabled = true;
      addUserMessage(text);
      const botMsg = createBotMessage("پرتو در حال پاسخ دادن است...");

      const recentHistory = history.slice(-8);
      const payloadMessages = [
        ...recentHistory,
        { role: "user", content: text }
      ];

      try {
        const res = await fetch("/api/chat", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({
            message: text,
            messages: payloadMessages,
            mode: currentTool,
            modeInstruction: toolInstructions[currentTool] || ""
          })
        });
        const data = await res.json();
        const reply = data.reply || "پاسخی دریافت نشد.";
        botMsg.setReply(reply);
        history.push({ role: "user", content: text });
        history.push({ role: "assistant", content: reply });
      } catch {
        botMsg.setError("خطا در ارتباط با سرور.");
      } finally {
        sendBtn.disabled = false;
        input.focus();
      }
    });

    renderWelcome();
  </script>
</body>
</html>
