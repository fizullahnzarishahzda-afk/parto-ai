<!doctype html>
<html lang="fa" dir="rtl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>پرتو هوش مصنوعی (نظری)</title>
  <style>
    * { box-sizing: border-box; font-family: Tahoma, Arial, sans-serif; }
    body { margin: 0; background: #0b1324; color: #f8fafc; display: flex; flex-direction: column; height: 100vh; overflow: hidden; }

    header {
      padding: 12px 14px;
      background: linear-gradient(90deg, #132238 0%, #172a46 100%);
      border-bottom: 1px solid #284166;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
      position: relative;
      z-index: 15;
    }
    .header-left { display: flex; align-items: center; gap: 10px; min-width: 0; }
    .brand { display: flex; align-items: center; gap: 8px; font-weight: bold; font-size: 0.96rem; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; color: #e0f2fe; }
    .dot { width: 9px; height: 9px; border-radius: 50%; background: #38bdf8; box-shadow: 0 0 8px #38bdf8; display: inline-block; flex-shrink: 0; }

    .hdr-btn {
      width: 36px;
      height: 36px;
      border-radius: 9px;
      border: 1px solid #355480;
      background: #0d182b;
      color: #e0f2fe;
      font-size: 1.05rem;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      flex-shrink: 0;
    }
    .hdr-btn:hover { background: #1e3a5f; border-color: #38bdf8; }

    .header-right { display: flex; align-items: center; gap: 6px; position: relative; }

    .three-dots-menu {
      position: absolute;
      top: 44px;
      left: 0;
      width: 255px;
      background: #132238;
      border: 1px solid #355480;
      border-radius: 12px;
      padding: 8px;
      display: none;
      flex-direction: column;
      gap: 6px;
      box-shadow: 0 12px 28px rgba(2, 8, 23, 0.65);
      z-index: 40;
    }
    .three-dots-menu.open { display: flex; }
    .gmail-box {
      background: #0b1324;
      border: 1px solid #284166;
      border-radius: 9px;
      padding: 8px;
      font-size: 0.8rem;
      color: #bae6fd;
      line-height: 1.5;
    }
    .gmail-addr { color: #38bdf8; font-weight: bold; word-break: break-all; margin-top: 2px; }
    .dots-action {
      width: 100%;
      padding: 9px 10px;
      border-radius: 8px;
      border: 1px solid #284166;
      background: #0b1324;
      color: #f8fafc;
      font-size: 0.84rem;
      text-align: right;
      cursor: pointer;
    }
    .dots-action:hover { background: #0284c7; border-color: #38bdf8; }

    .drawer-backdrop {
      position: fixed;
      inset: 0;
      background: rgba(2, 8, 23, 0.65);
      display: none;
      z-index: 30;
    }
    .drawer-backdrop.open { display: block; }

    .sidebar {
      position: fixed;
      top: 0;
      right: -290px;
      width: 280px;
      max-width: 82vw;
      height: 100vh;
      background: #0f1b30;
      border-left: 1px solid #284166;
      display: flex;
      flex-direction: column;
      padding: 14px;
      gap: 10px;
      transition: right 0.22s ease;
      z-index: 35;
    }
    .sidebar.open { right: 0; }
    .sidebar-top { display: flex; justify-content: space-between; align-items: center; font-weight: bold; color: #38bdf8; }
    .new-chat-btn {
      width: 100%;
      padding: 10px 12px;
      border-radius: 10px;
      border: none;
      background: linear-gradient(135deg, #0284c7, #2563eb);
      color: #fff;
      font-weight: bold;
      font-size: 0.9rem;
      cursor: pointer;
    }
    .new-chat-btn:hover { background: linear-gradient(135deg, #0369a1, #1d4ed8); }
    .chat-list {
      flex: 1;
      overflow-y: auto;
      display: flex;
      flex-direction: column;
      gap: 6px;
    }
    .chat-item {
      padding: 9px 11px;
      border-radius: 9px;
      border: 1px solid #1e3352;
      background: #0b1324;
      color: #e2e8f0;
      font-size: 0.84rem;
      text-align: right;
      cursor: pointer;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }
    .chat-item.active { background: #162946; border-color: #38bdf8; color: #fff; font-weight: bold; }

    .active-tool-bar {
      padding: 6px 16px;
      background: #0e192d;
      border-bottom: 1px solid #1e3352;
      font-size: 0.8rem;
      color: #7dd3fc;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
    }
    .reset-tool-btn {
      background: transparent;
      border: none;
      color: #bae6fd;
      text-decoration: underline;
      cursor: pointer;
      font-size: 0.78rem;
      padding: 0;
    }

    #chat { flex: 1; overflow-y: auto; padding: 16px; display: flex; flex-direction: column; gap: 12px; }

    .welcome-box {
      margin: auto;
      max-width: 560px;
      width: 100%;
      background: linear-gradient(180deg, #132238 0%, #101d32 100%);
      border: 1px solid #2c4770;
      border-radius: 16px;
      padding: 20px 16px;
      text-align: center;
      box-shadow: 0 10px 28px rgba(2, 8, 23, 0.45);
    }
    .welcome-title { font-size: 1.08rem; font-weight: bold; color: #38bdf8; margin-bottom: 10px; }
    .welcome-text { font-size: 0.95rem; line-height: 1.85; color: #f1f5f9; margin-bottom: 16px; }

    .quick-actions { display: flex; flex-direction: column; gap: 8px; align-items: center; }
    .quick-item {
      width: 100%;
      max-width: 340px;
      padding: 10px 14px;
      border-radius: 12px;
      border: 1px solid #2c4770;
      background: #0b1324;
      color: #e0f2fe;
      font-size: 0.88rem;
      cursor: pointer;
      transition: background 0.15s ease, border-color 0.15s ease;
    }
    .quick-item:hover { background: #162946; border-color: #38bdf8; }

    .msg-wrap { display: flex; flex-direction: column; max-width: 85%; gap: 4px; }
    .wrap-user { align-self: flex-start; }
    .wrap-bot { align-self: flex-end; }

    .msg { padding: 12px 14px; border-radius: 12px; line-height: 1.75; word-wrap: break-word; }
    .user { background: linear-gradient(135deg, #0284c7, #2563eb); color: #fff; white-space: pre-wrap; }
    .bot { background: #132238; border: 1px solid #284166; }
    .bot p { margin: 0 0 8px 0; }
    .bot p:last-child { margin-bottom: 0; }
    .bot h3 { margin: 10px 0 6px 0; color: #38bdf8; font-size: 1rem; }
    .bot ul { margin: 4px 0 8px 0; padding-right: 20px; }
    .bot li { margin-bottom: 4px; }

    .copy-btn {
      align-self: flex-end;
      padding: 3px 9px;
      font-size: 0.75rem;
      border-radius: 6px;
      border: 1px solid #284166;
      background: #0b1324;
      color: #7dd3fc;
      cursor: pointer;
    }
    .copy-btn:hover { color: #fff; border-color: #38bdf8; }

    .plus-menu {
      position: fixed;
      bottom: 74px;
      right: 16px;
      width: 230px;
      background: #132238;
      border: 1px solid #355480;
      border-radius: 14px;
      padding: 6px;
      display: none;
      flex-direction: column;
      gap: 2px;
      box-shadow: 0 10px 25px rgba(2, 8, 23, 0.55);
      z-index: 20;
    }
    .plus-menu.open { display: flex; }
    .menu-opt {
      padding: 10px 12px;
      border-radius: 10px;
      border: none;
      background: transparent;
      color: #f8fafc;
      text-align: right;
      font-size: 0.88rem;
      cursor: pointer;
    }
    .menu-opt:hover, .menu-opt.active { background: #0284c7; color: #fff; }

    form {
      display: flex;
      gap: 6px;
      padding: 10px 12px;
      background: #132238;
      border-top: 1px solid #284166;
      align-items: center;
    }
    .icon-btn {
      width: 40px;
      height: 40px;
      border-radius: 50%;
      border: 1px solid #355480;
      background: #0b1324;
      color: #e0f2fe;
      font-size: 1.05rem;
      cursor: pointer;
      flex-shrink: 0;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .icon-btn:hover { background: #1e3a5f; border-color: #38bdf8; }
    .icon-btn.recording, .icon-btn.live-active { background: #0284c7; border-color: #38bdf8; color: #fff; }

    textarea {
      flex: 1;
      resize: none;
      height: 44px;
      padding: 9px 10px;
      border-radius: 10px;
      border: 1px solid #355480;
      background: #0b1324;
      color: #fff;
      font-size: 0.9rem;
    }
    textarea:focus { outline: none; border-color: #38bdf8; }
    button[type="submit"] {
      height: 44px;
      padding: 0 14px;
      border: none;
      border-radius: 10px;
      background: linear-gradient(135deg, #10b981, #059669);
      color: #ecfdf5;
      font-weight: bold;
      cursor: pointer;
      flex-shrink: 0;
    }
    button[type="submit"]:hover { background: linear-gradient(135deg, #059669, #047857); }
    button:disabled { opacity: 0.6; cursor: not-allowed; }

    .live-overlay {
      position: fixed;
      inset: 0;
      background: #f0f9ff;
      color: #0b1324;
      display: none;
      flex-direction: column;
      justify-content: space-between;
      padding: 20px;
      z-index: 50;
    }
    .live-overlay.open { display: flex; }
    .live-top { display: flex; justify-content: space-between; align-items: center; font-weight: bold; font-size: 0.95rem; }
    .live-center { margin: auto; display: flex; flex-direction: column; align-items: center; gap: 18px; text-align: center; max-width: 480px; }
    .live-orb {
      width: 170px;
      height: 170px;
      border-radius: 50%;
      background: radial-gradient(circle at 30% 30%, #7dd3fc, #0284c7 65%, #1d4ed8);
      box-shadow: 0 12px 35px rgba(2, 132, 199, 0.35);
      transition: transform 0.25s ease;
    }
    .live-orb.pulse { transform: scale(1.08); }
    .live-status { font-size: 1rem; font-weight: bold; color: #0f172a; }
    .live-transcript { font-size: 0.9rem; color: #334155; line-height: 1.7; max-height: 150px; overflow-y: auto; padding: 0 8px; }
    .live-bottom { display: flex; justify-content: center; gap: 18px; align-items: center; padding-bottom: 12px; }
    .live-circle-btn {
      width: 54px;
      height: 54px;
      border-radius: 50%;
      border: 1px solid #bae6fd;
      background: #ffffff;
      color: #0b1324;
      font-size: 1.1rem;
      font-weight: bold;
      cursor: pointer;
      box-shadow: 0 4px 12px rgba(2, 132, 199, 0.12);
    }
    .live-circle-btn.muted { background: #e2e8f0; color: #475569; }
    .live-close-btn { background: #0b1324; color: #ffffff; border-color: #0b1324; }
  </style>
</head>
<body>
  <div class="drawer-backdrop" id="drawerBackdrop"></div>

  <aside class="sidebar" id="sidebar">
    <div class="sidebar-top">
      <span>گفتگوهای پرتو</span>
      <button type="button" class="hdr-btn" id="closeSidebarBtn" title="بستن منو">✕</button>
    </div>
    <button type="button" class="new-chat-btn" id="newChatBtn">+ صفحه / چت جدید</button>
    <div class="chat-list" id="chatList"></div>
  </aside>

  <header>
    <div class="header-left">
      <button type="button" class="hdr-btn" id="menuBtn" title="منو">☰</button>
      <div class="brand">
        <span class="dot"></span>
        <span>پرتو هوش مصنوعی (نظری)</span>
      </div>
    </div>

    <div class="header-right">
      <button type="button" class="hdr-btn" id="dotsBtn" title="گزینه‌ها و جیمیل">⋮</button>
      <div class="three-dots-menu" id="threeDotsMenu">
        <div class="gmail-box">
          <div>جیمیل متصل‌شده:</div>
          <div class="gmail-addr" id="gmailDisplay">ثبت نشده</div>
        </div>
        <button type="button" class="dots-action" id="setGmailBtn">✉️ اتصال / تغییر جیمیل</button>
        <button type="button" class="dots-action" id="sendNotesBtn">📤 ارسال نوشته‌ها به جیمیل</button>
        <button type="button" class="dots-action" id="clearCurrentBtn">🗑️ پاک کردن چت فعلی</button>
      </div>
    </div>
  </header>

  <div id="gmailModal" style="display:none; position:fixed; inset:0; background:rgba(2,8,23,0.7); z-index:60; align-items:center; justify-content:center; padding:16px;">
    <div style="background:#132238; border:1px solid #355480; border-radius:14px; padding:16px; width:100%; max-width:360px; display:flex; flex-direction:column; gap:10px;">
      <div style="font-weight:bold; color:#38bdf8; font-size:0.95rem;">اتصال یا انتخاب جیمیل</div>
      <input
        type="email"
        id="gmailInput"
        autocomplete="email"
        placeholder="example@gmail.com"
        style="width:100%; padding:10px; border-radius:8px; border:1px solid #355480; background:#0b1324; color:#fff; direction:ltr; text-align:left;"
      />
      <div id="savedGmailChips" style="display:flex; flex-wrap:wrap; gap:6px;"></div>
      <div style="display:flex; gap:8px; justify-content:flex-end; margin-top:4px;">
        <button type="button" id="cancelGmailBtn" style="padding:8px 12px; border-radius:8px; border:1px solid #355480; background:#0b1324; color:#e2e8f0; cursor:pointer;">لغو</button>
        <button type="button" id="saveGmailConfirmBtn" style="padding:8px 14px; border-radius:8px; border:none; background:#10b981; color:#ecfdf5; font-weight:bold; cursor:pointer;">ذخیره</button>
      </div>
    </div>
  </div>

  <div class="active-tool-bar">
    <span id="activeToolLabel">حالت فعلی: گفتگوی عادی</span>
    <button type="button" class="reset-tool-btn" id="resetToolBtn">بازگشت به حالت عادی</button>
  </div>

  <div id="chat"></div>

  <div class="plus-menu" id="plusMenu">
    <button type="button" class="menu-opt" data-tool="camera">📷 دوربین</button>
    <button type="button" class="menu-opt" data-tool="photos">🖼️ تصاویر</button>
    <button type="button" class="menu-opt" data-tool="files">📎 فایل‌ها</button>
    <button type="button" class="menu-opt" data-tool="plugins">🔌 افزونه‌ها</button>
    <button type="button" class="menu-opt" data-tool="think">🧠 تفکر عمیق‌تر</button>
  </div>

  <form id="form">
    <button type="button" class="icon-btn" id="plusBtn" title="گزینه‌های بیشتر">+</button>
    <textarea id="input" placeholder="از پرتو هر سوالی داری بپرس..."></textarea>
    <button type="button" class="icon-btn" id="micBtn" title="تبدیل صدا به متن">🎤</button>
    <button type="button" class="icon-btn" id="liveBtn" title="مکالمه صوتی زنده">🎙️</button>
    <button type="submit" id="sendBtn">ارسال</button>
  </form>

  <div class="live-overlay" id="liveOverlay">
    <div class="live-top">
      <span>پرتو هوش مصنوعی (نظری)</span>
      <span>مکالمه زنده</span>
    </div>
    <div class="live-center">
      <div class="live-orb" id="liveOrb"></div>
      <div class="live-status" id="liveStatus">در حال گوش دادن...</div>
      <div class="live-transcript" id="liveTranscript">حرف بزنید تا پرتو جواب دهد و دوباره گوش کند.</div>
    </div>
    <div class="live-bottom">
      <button type="button" class="live-circle-btn" id="liveMuteBtn" title="بی‌صدا / فعال کردن میکروفون">🎤</button>
      <button type="button" class="live-circle-btn live-close-btn" id="liveCloseBtn" title="خروج از مکالمه زنده">✕</button>
    </div>
  </div>

  <input type="file" id="filePicker" style="display:none" />

  <script>
    const WELCOME_TITLE = "پرتو هوش مصنوعی (نظری)";
    const WELCOME_MESSAGE = "من (پرتو) هستم دستیار هوش مصنوعی فیض الله نظری چطور میتوانم کمکتان کنم ؟";
    const STORAGE_CHATS_KEY = "parto_sessions_v1";
    const STORAGE_GMAIL_KEY = "parto_user_gmail_v1";
    const STORAGE_GMAIL_LIST_KEY = "parto_saved_gmails_v1";

    const menuBtn = document.getElementById("menuBtn");
    const closeSidebarBtn = document.getElementById("closeSidebarBtn");
    const drawerBackdrop = document.getElementById("drawerBackdrop");
    const sidebar = document.getElementById("sidebar");
    const newChatBtn = document.getElementById("newChatBtn");
    const chatListEl = document.getElementById("chatList");

    const dotsBtn = document.getElementById("dotsBtn");
    const threeDotsMenu = document.getElementById("threeDotsMenu");
    const gmailDisplay = document.getElementById("gmailDisplay");
    const setGmailBtn = document.getElementById("setGmailBtn");
    const sendNotesBtn = document.getElementById("sendNotesBtn");
    const clearCurrentBtn = document.getElementById("clearCurrentBtn");

    const gmailModal = document.getElementById("gmailModal");
    const gmailInput = document.getElementById("gmailInput");
    const savedGmailChips = document.getElementById("savedGmailChips");
    const cancelGmailBtn = document.getElementById("cancelGmailBtn");
    const saveGmailConfirmBtn = document.getElementById("saveGmailConfirmBtn");

    const chat = document.getElementById("chat");
    const form = document.getElementById("form");
    const input = document.getElementById("input");
    const sendBtn = document.getElementById("sendBtn");
    const plusBtn = document.getElementById("plusBtn");
    const plusMenu = document.getElementById("plusMenu");
    const micBtn = document.getElementById("micBtn");
    const liveBtn = document.getElementById("liveBtn");
    const activeToolLabel = document.getElementById("activeToolLabel");
    const resetToolBtn = document.getElementById("resetToolBtn");
    const filePicker = document.getElementById("filePicker");
    const menuOpts = document.querySelectorAll(".menu-opt");

    const liveOverlay = document.getElementById("liveOverlay");
    const liveOrb = document.getElementById("liveOrb");
    const liveStatus = document.getElementById("liveStatus");
    const liveTranscript = document.getElementById("liveTranscript");
    const liveMuteBtn = document.getElementById("liveMuteBtn");
    const liveCloseBtn = document.getElementById("liveCloseBtn");

    let currentTool = "normal";
    let sessions = loadSessions();
    let activeSessionId = sessions[0]?.id || createNewSessionObj();
    let userGmail = localStorage.getItem(STORAGE_GMAIL_KEY) || "";

    const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
    let dictRecognition = null;
    let isDictating = false;

    let liveActive = false;
    let liveMuted = false;
    let liveRecognition = null;
    let liveBusy = false;

    const toolLabels = {
      normal: "حالت فعلی: گفتگوی عادی",
      image_prompt: "حالت فعلی: ایجاد تصویر یا استیکر",
      write_edit: "حالت فعلی: بنویسید یا ویرایش کنید",
      web_guide: "حالت فعلی: جستجو در وب",
      camera: "حالت فعلی: دوربین",
      photos: "حالت فعلی: تصاویر",
      files: "حالت فعلی: فایل‌ها",
      plugins: "حالت فعلی: افزونه‌ها",
      think: "حالت فعلی: تفکر عمیق‌تر"
    };

    const toolInstructions = {
      normal: "پاسخ‌ها را واضح، صمیمی و دقیق بده.",
      image_prompt: "برای درخواست تصویر یا استیکر، پرامپت دقیق بده و اگر ابزار تولید تصویر جدا لازم است شفاف توضیح بده.",
      write_edit: "متن را با کیفیت بالا بنویس، اصلاح کن یا بازنویسی کن.",
      web_guide: "موضوع را با توضیح شفاف و منظم بررسی کن.",
      camera: "بر اساس توضیح کاربر درباره صحنه دوربین، راهنمای دقیق بده.",
      photos: "بر اساس توضیح کاربر درباره عکس، راهنما یا پرامپت مناسب بده.",
      files: "محتوای متنی فایل را دقیق بررسی، خلاصه یا ویرایش کن.",
      plugins: "راهکار عملی و مرحله‌به‌مرحله ارائه بده.",
      think: "مسئله را عمیق‌تر و مرحله‌به‌مرحله تحلیل کن."
    };

    function createNewSessionObj() {
      const id = "s_" + Date.now() + "_" + Math.random().toString(36).slice(2, 6);
      const item = { id, title: "صفحه جدید", messages: [] };
      sessions.unshift(item);
      saveSessions();
      return id;
    }

    function loadSessions() {
      try {
        const raw = localStorage.getItem(STORAGE_CHATS_KEY);
        const parsed = JSON.parse(raw || "[]");
        return Array.isArray(parsed) && parsed.length ? parsed : [];
      } catch {
        return [];
      }
    }

    function saveSessions() {
      try {
        localStorage.setItem(STORAGE_CHATS_KEY, JSON.stringify(sessions.slice(0, 30)));
      } catch {}
    }

    function getActiveSession() {
      let s = sessions.find((x) => x.id === activeSessionId);
      if (!s) {
        activeSessionId = createNewSessionObj();
        s = sessions[0];
      }
      return s;
    }

    function updateGmailUI() {
      gmailDisplay.textContent = userGmail || "ثبت نشده";
    }

    function loadSavedGmails() {
      try {
        const arr = JSON.parse(localStorage.getItem(STORAGE_GMAIL_LIST_KEY) || "[]");
        return Array.isArray(arr) ? arr : [];
      } catch {
        return [];
      }
    }

    function renderSavedGmailChips() {
      savedGmailChips.innerHTML = "";
      const list = loadSavedGmails();
      list.forEach((addr) => {
        const chip = document.createElement("button");
        chip.type = "button";
        chip.textContent = addr;
        chip.style.cssText = "padding:5px 9px; border-radius:999px; border:1px solid #284166; background:#0b1324; color:#7dd3fc; font-size:0.78rem; cursor:pointer;";
        chip.addEventListener("click", () => {
          gmailInput.value = addr;
        });
        savedGmailChips.appendChild(chip);
      });
    }

    setGmailBtn.addEventListener("click", () => {
      threeDotsMenu.classList.remove("open");
      gmailInput.value = userGmail || "";
      renderSavedGmailChips();
      gmailModal.style.display = "flex";
      setTimeout(() => gmailInput.focus(), 50);
    });

    cancelGmailBtn.addEventListener("click", () => {
      gmailModal.style.display = "none";
    });

    saveGmailConfirmBtn.addEventListener("click", () => {
      const clean = gmailInput.value.trim();
      if (clean && !/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(clean)) {
        alert("لطفاً یک آدرس جیمیل معتبر وارد کنید.");
        return;
      }
      userGmail = clean;
      localStorage.setItem(STORAGE_GMAIL_KEY, userGmail);
      if (clean) {
        const list = loadSavedGmails();
        if (!list.includes(clean)) {
          list.unshift(clean);
          localStorage.setItem(STORAGE_GMAIL_LIST_KEY, JSON.stringify(list.slice(0, 6)));
        }
      }
      updateGmailUI();
      gmailModal.style.display = "none";
      alert(userGmail ? `جیمیل «${userGmail}» ذخیره شد.` : "جیمیل پاک شد.");
    });

    sendNotesBtn.addEventListener("click", async () => {
      threeDotsMenu.classList.remove("open");
      if (!userGmail) {
        alert("ابتدا از همین منوی سه‌نقطه، جیمیل خود را ثبت کنید.");
        return;
      }
      const s = getActiveSession();
      if (!s.messages.length) {
        alert("در این صفحه هنوز نوشته‌ای برای ارسال وجود ندارد.");
        return;
      }
      const textBody = s.messages
        .map((m) => `${m.role === "user" ? "شما" : "پرتو"}:\n${m.content}`)
        .join("\n\n-------------------\n\n");

      try {
        await navigator.clipboard.writeText(textBody);
      } catch {}

      const subject = encodeURIComponent(`نوشته‌های پرتو - ${s.title}`);
      const body = encodeURIComponent(textBody.slice(0, 3500));
      window.location.href = `mailto:${encodeURIComponent(userGmail)}?subject=${subject}&body=${body}`;
    });

    dotsBtn.addEventListener("click", (e) => {
      e.stopPropagation();
      threeDotsMenu.classList.toggle("open");
      plusMenu.classList.remove("open");
    });

    function openSidebar() {
      renderChatList();
      sidebar.classList.add("open");
      drawerBackdrop.classList.add("open");
    }

    function closeSidebar() {
      sidebar.classList.remove("open");
      drawerBackdrop.classList.remove("open");
    }

    menuBtn.addEventListener("click", openSidebar);
    closeSidebarBtn.addEventListener("click", closeSidebar);
    drawerBackdrop.addEventListener("click", closeSidebar);

    newChatBtn.addEventListener("click", () => {
      activeSessionId = createNewSessionObj();
      renderChatList();
      renderActiveSession();
      closeSidebar();
    });

    function renderChatList() {
      chatListEl.innerHTML = "";
      sessions.forEach((s) => {
        const btn = document.createElement("button");
        btn.type = "button";
        btn.className = "chat-item" + (s.id === activeSessionId ? " active" : "");
        btn.textContent = s.title || "صفحه جدید";
        btn.addEventListener("click", () => {
          activeSessionId = s.id;
          renderChatList();
          renderActiveSession();
          closeSidebar();
        });
        chatListEl.appendChild(btn);
      });
    }

    function setTool(toolKey) {
      currentTool = toolKey;
      activeToolLabel.textContent = toolLabels[toolKey] || toolLabels.normal;
      menuOpts.forEach((opt) => opt.classList.toggle("active", opt.dataset.tool === toolKey));
    }

    plusBtn.addEventListener("click", (e) => {
      e.stopPropagation();
      plusMenu.classList.toggle("open");
      threeDotsMenu.classList.remove("open");
    });

    document.addEventListener("click", (e) => {
      if (!plusMenu.contains(e.target) && e.target !== plusBtn) plusMenu.classList.remove("open");
      if (!threeDotsMenu.contains(e.target) && e.target !== dotsBtn) threeDotsMenu.classList.remove("open");
    });

    resetToolBtn.addEventListener("click", () => setTool("normal"));

    menuOpts.forEach((opt) => {
      opt.addEventListener("click", () => {
        const chosen = opt.dataset.tool;
        plusMenu.classList.remove("open");
        if (chosen === "camera") {
          filePicker.accept = "image/*";
          filePicker.setAttribute("capture", "environment");
          setTool("camera");
          filePicker.click();
          return;
        }
        if (chosen === "photos") {
          filePicker.accept = "image/*";
          filePicker.removeAttribute("capture");
          setTool("photos");
          filePicker.click();
          return;
        }
        if (chosen === "files") {
          filePicker.accept = ".txt,.md,.csv,.json,.html,.py,.js";
          filePicker.removeAttribute("capture");
          setTool("files");
          filePicker.click();
          return;
        }
        setTool(chosen);
        input.focus();
      });
    });

    filePicker.addEventListener("change", () => {
      const f = filePicker.files && filePicker.files[0];
      if (!f) return;
      if (f.type && f.type.startsWith("text/")) {
        const reader = new FileReader();
        reader.onload = () => {
          const content = String(reader.result || "").slice(0, 4000);
          input.value = `محتوای فایل (${f.name}):\n${content}`;
          input.focus();
        };
        reader.readAsText(f, "utf-8");
      } else {
        input.value = `فایل «${f.name}» انتخاب شد. درباره این موضوع چه کمکی می‌خواهی؟`;
        input.focus();
      }
      filePicker.value = "";
    });

    function renderWelcome() {
      const box = document.createElement("div");
      box.className = "welcome-box";
      box.id = "welcomeBox";

      const titleEl = document.createElement("div");
      titleEl.className = "welcome-title";
      titleEl.textContent = WELCOME_TITLE;

      const textEl = document.createElement("div");
      textEl.className = "welcome-text";
      textEl.textContent = WELCOME_MESSAGE;

      const quickList = document.createElement("div");
      quickList.className = "quick-actions";

      const items = [
        { label: "🖼️ ایجاد تصویر یا استیکر", tool: "image_prompt", sample: "یک پرامپت دقیق برای ساخت تصویر یا استیکر بنویس: " },
        { label: "✏️ بنویسید یا ویرایش کنید", tool: "write_edit", sample: "این متن را بنویس یا ویرایش کن: " },
        { label: "🌐 جستجو در وب", tool: "web_guide", sample: "درباره این موضوع توضیح کامل و دقیق بده: " }
      ];

      items.forEach((it) => {
        const btn = document.createElement("button");
        btn.type = "button";
        btn.className = "quick-item";
        btn.textContent = it.label;
        btn.addEventListener("click", () => {
          setTool(it.tool);
          input.value = it.sample;
          input.focus();
        });
        quickList.appendChild(btn);
      });

      box.appendChild(titleEl);
      box.appendChild(textEl);
      box.appendChild(quickList);
      chat.appendChild(box);
    }

    function removeWelcome() {
      const box = document.getElementById("welcomeBox");
      if (box) box.remove();
    }

    function escapeHtml(str) {
      return str
        .replace(/&/g, "&amp;")
        .replace(/</g, "&lt;")
        .replace(/>/g, "&gt;")
        .replace(/"/g, "&quot;");
    }

    function formatBotText(raw) {
      const safe = escapeHtml(raw || "");
      const lines = safe.split("\n");
      let html = "";
      let inList = false;

      for (let line of lines) {
        let trimmed = line.trim();
        if (!trimmed) {
          if (inList) { html += "</ul>"; inList = false; }
          continue;
        }
        trimmed = trimmed.replace(/\*\*(.+?)\*\*/g, "<strong>$1</strong>");
        if (/^#{1,6}\s+/.test(trimmed)) {
          if (inList) { html += "</ul>"; inList = false; }
          html += `<h3>${trimmed.replace(/^#{1,6}\s+/, "")}</h3>`;
        } else if (/^[-*•]\s+/.test(trimmed)) {
          if (!inList) { html += "<ul>"; inList = true; }
          html += `<li>${trimmed.replace(/^[-*•]\s+/, "")}</li>`;
        } else {
          if (inList) { html += "</ul>"; inList = false; }
          html += `<p>${trimmed}</p>`;
        }
      }
      if (inList) html += "</ul>";
      return html || "<p>پاسخی دریافت نشد.</p>";
    }

    function appendUserBubble(text) {
      removeWelcome();
      const wrap = document.createElement("div");
      wrap.className = "msg-wrap wrap-user";
      const div = document.createElement("div");
      div.className = "msg user";
      div.textContent = text;
      wrap.appendChild(div);
      chat.appendChild(wrap);
      chat.scrollTop = chat.scrollHeight;
    }

    function createBotBubble(initialText = "پرتو در حال پاسخ دادن است...") {
      const wrap = document.createElement("div");
      wrap.className = "msg-wrap wrap-bot";
      const div = document.createElement("div");
      div.className = "msg bot";
      div.textContent = initialText;

      const copyBtn = document.createElement("button");
      copyBtn.type = "button";
      copyBtn.className = "copy-btn";
      copyBtn.textContent = "کپی";
      copyBtn.style.display = "none";

      wrap.appendChild(div);
      wrap.appendChild(copyBtn);
      chat.appendChild(wrap);
      chat.scrollTop = chat.scrollHeight;

      return {
        setReply(rawText) {
          div.innerHTML = formatBotText(rawText);
          copyBtn.style.display = "inline-block";
          copyBtn.onclick = async () => {
            try {
              await navigator.clipboard.writeText(rawText);
              copyBtn.textContent = "کپی شد ✓";
              setTimeout(() => (copyBtn.textContent = "کپی"), 1500);
            } catch {
              copyBtn.textContent = "ناموفق";
              setTimeout(() => (copyBtn.textContent = "کپی"), 1500);
            }
          };
          chat.scrollTop = chat.scrollHeight;
        },
        setError(errText) {
          div.textContent = errText;
          chat.scrollTop = chat.scrollHeight;
        }
      };
    }

    function renderActiveSession() {
      chat.innerHTML = "";
      const s = getActiveSession();
      if (!s.messages.length) {
        renderWelcome();
        return;
      }
      s.messages.forEach((m) => {
        if (m.role === "user") {
          appendUserBubble(m.content);
        } else {
          const b = createBotBubble("");
          b.setReply(m.content);
        }
      });
    }

    async function sendToParto(text) {
      const s = getActiveSession();
      const recentHistory = s.messages.slice(-8);
      const payloadMessages = [...recentHistory, { role: "user", content: text }];
      const res = await fetch("/api/chat", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({
          message: text,
          messages: payloadMessages,
          mode: currentTool,
          modeInstruction: toolInstructions[currentTool] || ""
        })
      });
      const data = await res.json();
      return data.reply || "پاسخی دریافت نشد.";
    }

    clearCurrentBtn.addEventListener("click", () => {
      threeDotsMenu.classList.remove("open");
      const s = getActiveSession();
      s.messages = [];
      s.title = "صفحه جدید";
      saveSessions();
      renderChatList();
      renderActiveSession();
    });

    micBtn.addEventListener("click", () => {
      if (!SpeechRecognition) {
        alert("مرورگر شما از تبدیل صدا به متن پشتیبانی نمی‌کند. لطفاً از Chrome یا Edge استفاده کنید.");
        return;
      }
      if (isDictating && dictRecognition) {
        dictRecognition.stop();
        return;
      }
      dictRecognition = new SpeechRecognition();
      dictRecognition.lang = "fa-IR";
      dictRecognition.interimResults = true;
      dictRecognition.continuous = false;
      isDictating = true;
      micBtn.classList.add("recording");
      const baseText = input.value ? input.value + " " : "";
      dictRecognition.onresult = (event) => {
        let transcript = "";
        for (let i = 0; i < event.results.length; i++) transcript += event.results[i][0].transcript;
        input.value = (baseText + transcript).trim();
      };
      dictRecognition.onerror = () => { isDictating = false; micBtn.classList.remove("recording"); };
      dictRecognition.onend = () => { isDictating = false; micBtn.classList.remove("recording"); input.focus(); };
      dictRecognition.start();
    });

    function speakAndThenListen(replyText) {
      if (!liveActive) return;
      const cleanText = replyText.replace(/[#*_`]/g, "").trim();
      liveStatus.textContent = "پرتو در حال صحبت است...";
      liveOrb.classList.add("pulse");
      liveTranscript.textContent = cleanText;

      if ("speechSynthesis" in window && cleanText) {
        window.speechSynthesis.cancel();
        const utter = new SpeechSynthesisUtterance(cleanText);
        utter.lang = "fa-IR";
        utter.onend = () => {
          liveOrb.classList.remove("pulse");
          if (liveActive && !liveMuted) startLiveListening();
          else if (liveActive) liveStatus.textContent = "میکروفون بی‌صدا است";
        };
        utter.onerror = () => {
          liveOrb.classList.remove("pulse");
          if (liveActive && !liveMuted) startLiveListening();
        };
        window.speechSynthesis.speak(utter);
      } else {
        liveOrb.classList.remove("pulse");
        if (liveActive && !liveMuted) startLiveListening();
      }
    }

    function startLiveListening() {
      if (!liveActive || liveMuted || liveBusy) return;
      if (!SpeechRecognition) {
        liveStatus.textContent = "تشخیص صدا در این مرورگر پشتیبانی نمی‌شود";
        return;
      }
      try {
        if (liveRecognition) { try { liveRecognition.abort(); } catch {} }
        liveRecognition = new SpeechRecognition();
        liveRecognition.lang = "fa-IR";
        liveRecognition.interimResults = true;
        liveRecognition.continuous = false;
        liveStatus.textContent = "در حال گوش دادن... سوالت را بپرس";
        liveOrb.classList.add("pulse");

        let finalSpoken = "";
        liveRecognition.onresult = (event) => {
          let interim = "";
          finalSpoken = "";
          for (let i = 0; i < event.results.length; i++) {
            const t = event.results[i][0].transcript;
            if (event.results[i].isFinal) finalSpoken += t;
            else interim += t;
          }
          liveTranscript.textContent = (finalSpoken || interim) || "...";
        };

        liveRecognition.onend = async () => {
          liveOrb.classList.remove("pulse");
          const spokenText = finalSpoken.trim();
          if (!liveActive) return;
          if (!spokenText) {
            if (!liveMuted && !liveBusy) startLiveListening();
            return;
          }

          liveBusy = true;
          liveStatus.textContent = "پرتو در حال فکر کردن است...";
          const s = getActiveSession();
          if (s.title === "صفحه جدید") s.title = spokenText.slice(0, 28);
          s.messages.push({ role: "user", content: spokenText });
          saveSessions();
          renderChatList();
          appendUserBubble(spokenText);
          const botMsg = createBotBubble("پرتو در حال پاسخ دادن است...");

          try {
            const reply = await sendToParto(spokenText);
            s.messages.push({ role: "assistant", content: reply });
            saveSessions();
            botMsg.setReply(reply);
            liveBusy = false;
            speakAndThenListen(reply);
          } catch {
            liveBusy = false;
            botMsg.setError("خطا در ارتباط با سرور.");
            liveStatus.textContent = "خطا در ارتباط؛ دوباره گوش می‌دهم...";
            if (!liveMuted) startLiveListening();
          }
        };

        liveRecognition.onerror = () => {
          liveOrb.classList.remove("pulse");
          if (liveActive && !liveMuted && !liveBusy) setTimeout(() => startLiveListening(), 400);
        };

        liveRecognition.start();
      } catch {
        if (liveActive && !liveMuted && !liveBusy) setTimeout(() => startLiveListening(), 500);
      }
    }

    function openLiveMode() {
      if (!SpeechRecognition) {
        alert("برای مکالمه صوتی زنده، صفحه را در مرورگر Chrome یا Edge باز کن.");
        return;
      }
      if (isDictating && dictRecognition) dictRecognition.stop();
      liveActive = true;
      liveMuted = false;
      liveBusy = false;
      liveMuteBtn.classList.remove("muted");
      liveMuteBtn.textContent = "🎤";
      liveBtn.classList.add("live-active");
      liveOverlay.classList.add("open");
      liveTranscript.textContent = "حرف بزنید تا پرتو جواب دهد و دوباره گوش کند.";
      startLiveListening();
    }

    function closeLiveMode() {
      liveActive = false;
      liveBusy = false;
      liveBtn.classList.remove("live-active");
      liveOverlay.classList.remove("open");
      liveOrb.classList.remove("pulse");
      if ("speechSynthesis" in window) window.speechSynthesis.cancel();
      if (liveRecognition) { try { liveRecognition.abort(); } catch {} liveRecognition = null; }
    }

    liveBtn.addEventListener("click", openLiveMode);
    liveCloseBtn.addEventListener("click", closeLiveMode);
    liveMuteBtn.addEventListener("click", () => {
      liveMuted = !liveMuted;
      if (liveMuted) {
        liveMuteBtn.classList.add("muted");
        liveMuteBtn.textContent = "🔇";
        liveStatus.textContent = "میکروفون بی‌صدا است";
        if (liveRecognition) { try { liveRecognition.abort(); } catch {} }
      } else {
        liveMuteBtn.classList.remove("muted");
        liveMuteBtn.textContent = "🎤";
        startLiveListening();
      }
    });

    input.addEventListener("keydown", (e) => {
      if (e.key === "Enter" && !e.shiftKey) {
        e.preventDefault();
        form.requestSubmit();
      }
    });

    form.addEventListener("submit", async (e) => {
      e.preventDefault();
      const text = input.value.trim();
      if (!text) return;

      input.value = "";
      sendBtn.disabled = true;

      const s = getActiveSession();
      if (s.title === "صفحه جدید") s.title = text.slice(0, 28);
      s.messages.push({ role: "user", content: text });
      saveSessions();
      renderChatList();
      appendUserBubble(text);

      const botMsg = createBotBubble("پرتو در حال پاسخ دادن است...");

      try {
        const reply = await sendToParto(text);
        s.messages.push({ role: "assistant", content: reply });
        saveSessions();
        botMsg.setReply(reply);
      } catch {
        botMsg.setError("خطا در ارتباط با سرور.");
      } finally {
        sendBtn.disabled = false;
        input.focus();
      }
    });

    updateGmailUI();
    renderChatList();
    renderActiveSession();
  </script>
</body>
</html>
