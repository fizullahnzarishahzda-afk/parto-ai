<!doctype html>
<html lang="fa" dir="rtl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>دستیار هوشمند جدید</title>
  <style>
    * { box-sizing: border-box; font-family: Tahoma, Arial, sans-serif; }
    body { margin: 0; background: #0f172a; color: #f8fafc; display: flex; flex-direction: column; height: 100vh; }
    header { padding: 14px 18px; background: #1e293b; border-bottom: 1px solid #334155; font-weight: bold; }
    #chat { flex: 1; overflow-y: auto; padding: 18px; display: flex; flex-direction: column; gap: 12px; }
    .msg { max-width: 85%; padding: 12px 14px; border-radius: 12px; white-space: pre-wrap; line-height: 1.6; }
    .user { align-self: flex-start; background: #2563eb; color: #fff; }
    .bot { align-self: flex-end; background: #1e293b; border: 1px solid #334155; }
    form { display: flex; gap: 8px; padding: 12px; background: #1e293b; border-top: 1px solid #334155; }
    textarea { flex: 1; resize: none; height: 48px; padding: 10px; border-radius: 8px; border: 1px solid #475569; background: #0f172a; color: #fff; }
    button { padding: 0 18px; border: none; border-radius: 8px; background: #22c55e; color: #052e16; font-weight: bold; cursor: pointer; }
  </style>
</head>
<body>
  <header>دستیار هوشمند جدید</header>
  <div id="chat"></div>
  <form id="form">
    <textarea id="input" placeholder="هر سوالی یا کدی داری بنویس..."></textarea>
    <button type="submit">ارسال</button>
  </form>
  <script>
    const chat = document.getElementById("chat");
    const form = document.getElementById("form");
    const input = document.getElementById("input");

    function addMsg(text, cls) {
      const div = document.createElement("div");
      div.className = "msg " + cls;
      div.textContent = text;
      chat.appendChild(div);
      chat.scrollTop = chat.scrollHeight;
      return div;
    }

    form.addEventListener("submit", async (e) => {
      e.preventDefault();
      const text = input.value.trim();
      if (!text) return;
      input.value = "";
      addMsg(text, "user");
      const loading = addMsg("در حال فکر کردن...", "bot");

      try {
        const res = await fetch("/api/chat", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ message: text })
        });
        const data = await res.json();
        loading.textContent = data.reply || "پاسخی دریافت نشد.";
      } catch {
        loading.textContent = "خطا در ارتباط با سرور محلی.";
      }
    });
  </script>
</body>
</html>
