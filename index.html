<!-- داخل منوی سه‌نقطه (three-dots-menu) بعد از gmail-box این مودال/فرم کوچک را بگذار -->
<div id="gmailModal" style="display:none; position:fixed; inset:0; background:rgba(0,0,0,0.6); z-index:60; align-items:center; justify-content:center; padding:16px;">
  <div style="background:#1e293b; border:1px solid #475569; border-radius:14px; padding:16px; width:100%; max-width:360px; display:flex; flex-direction:column; gap:10px;">
    <div style="font-weight:bold; color:#38bdf8; font-size:0.95rem;">اتصال یا انتخاب جیمیل</div>
    <input
      type="email"
      id="gmailInput"
      autocomplete="email"
      placeholder="example@gmail.com"
      style="width:100%; padding:10px; border-radius:8px; border:1px solid #475569; background:#0f172a; color:#fff; direction:ltr; text-align:left;"
    />
    <div id="savedGmailChips" style="display:flex; flex-wrap:wrap; gap:6px;"></div>
    <div style="display:flex; gap:8px; justify-content:flex-end; margin-top:4px;">
      <button type="button" id="cancelGmailBtn" style="padding:8px 12px; border-radius:8px; border:1px solid #475569; background:#0f172a; color:#e2e8f0; cursor:pointer;">لغو</button>
      <button type="button" id="saveGmailConfirmBtn" style="padding:8px 14px; border-radius:8px; border:none; background:#22c55e; color:#052e16; font-weight:bold; cursor:pointer;">ذخیره</button>
    </div>
  </div>
</div>
